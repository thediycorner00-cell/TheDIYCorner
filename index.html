<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The DIY Corner | Official</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #ffffff; color: #000; }

        /* BANNER */
        .banner { 
            width: 100%; 
            height: 220px; 
            background: #111; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #fff;
            text-align: center;
            border-bottom: 4px solid #000;
        }
        .banner h1 { font-size: 2.5rem; letter-spacing: 3px; text-transform: uppercase; }

        /* NAVIGATION */
        nav { 
            background: #fff; 
            padding: 15px; 
            border-bottom: 1px solid #ddd; 
            display: flex; 
            justify-content: center; 
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        nav a { text-decoration: none; color: #333; font-weight: bold; font-size: 13px; text-transform: uppercase; }

        /* STORE SECTION */
        .container { max-width: 1000px; margin: 30px auto; padding: 20px; }
        .title { font-size: 22px; font-weight: bold; margin-bottom: 25px; }

        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
        }
