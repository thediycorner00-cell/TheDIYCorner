<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The DIY Corner | Dark Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #000000; color: #ffffff; }

        /* DARK BANNER */
        .banner { 
            width: 100%; 
            height: 200px; 
            background: #0a0a0a; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            border-bottom: 1px solid #1a1a1a;
            text-align: center;
        }
        .banner h1 { font-size: 2.2rem; letter-spacing: 4px; text-transform: uppercase; color: #eee; }
        .banner p { color: #00ffcc; font-size: 13px; margin-top: 5px; font-family: monospace; letter-spacing: 2px; }

        /* NAVIGATION BAR */
        nav { 
            background: #050505; 
            padding: 15px; 
            border-bottom: 1px solid #111; 
            display: flex; 
            justify-content: center; 
            gap: 25px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav a { text-decoration: none; color: #888; font-weight: 600; font-size: 12px; text-transform: uppercase; transition: 0.3s; }
        nav a:hover { color: #00ffcc; }

        /* STORE SECTION */
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 30px; color: #00ffcc; border-left: 3px solid #00ffcc; padding-left: 10px; }

        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 30px; 
        }

        /* DARK PRODUCT CARD */
        .card { border: 1px solid #111; background: #080808; padding: 10px; border-radius: 4px; transition: 0.3s; }
        .card:hover { border-color: #00ffcc; transform: translateY(-5px); }
        .card img { 
            width: 100%; 
            height: 350px; 
            object-fit: cover; 
            background: #111; 
            border-radius: 2px;
        }
        .card-info { padding: 15px 5px; }
        .product-name { font-size: 15px; color: #ccc; margin-bottom: 8px; }
        .price { font-size: 18px; font-weight: bold; color: #fff; display: block; margin-bottom: 15px; }
        
        .buy-btn { 
            display: block; 
            padding: 12px; 
            background: transparent; 
            color: #00ffcc; 
            border: 1px solid #00ffcc;
            text-decoration: none; 
            font-weight: bold; 
            font-size: 12px;
            border-radius: 2px;
            text-align: center;
            transition: 0.3s;
        }
        .buy-btn:hover { background: #00ffcc; color: #000; }

        footer { text-align: center; padding: 60px; color: #333; font-size: 10px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="banner">
        <h1>THE DIY CORNER</h1>
        <p>DIGITAL ARCHIVE // 2026</p>
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#store">Store</a>
        <a href="#">About</a>
        <a href="#">Social</a>
    </nav>

    <div class="container" id="store">
        <div class="title">● Store & products :-</div>
        
        <div class="product-grid">
            
            <div class="card">
                <img src="" alt="Product Image">
                <div class="card-info">
                    <div class="product-name">Product Title Here</div>
                    <span class="price">Rs. 000/-</span>
                    <a href="#" class="buy-btn">BUY NOW</a>
                </div>
            </div>

            <div class="card">
                <img src="" alt="Product Image">
                <div class="card-info">
                    <div class="product-name">Product Title Here</div>
                    <span class="price">Rs. 000/-</span>
                    <a href="#" class="buy-btn">BUY NOW</a>
                </div>
            </div>

        </div>
    </div>

    <footer>
        &copy; 2026 THE DIY CORNER // SYSTEM ONLINE
    </footer>

</body>
</html>
