<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The DIY Corner | Official</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; scroll-behavior: smooth; }
        body { background-color: #000; color: #fff; }

        /* BANNER - Jaisa SS mein tha */
        .banner { 
            width: 100%; 
            height: 280px; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://via.placeholder.com/1200x400?text=THE+DIY+CORNER+BANNER'); 
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .logo { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #00ffcc; margin-bottom: 10px; background: #111; }

        /* NAV BELOW BANNER */
        nav { background: #0a0a0a; padding: 15px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: center; gap: 25px; position: sticky; top: 0; z-index: 1000; }
        nav a { text-decoration: none; color: #888; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        nav a:hover { color: #00ffcc; }

        section { display: none; padding: 40px 20px; flex-direction: column; align-items: center; min-height: 80vh; }
        section:target { display: flex; }
        #home { display: flex; }

        /* STORE GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; width: 100%; max-width: 1100px; margin-top: 20px; }
        .card { background: #080808; border: 1px solid #111; border-radius: 8px; overflow: hidden; }
        .card img { width: 100%; height: 300px; object-fit: cover; background: #151515; }
        .card-body { padding: 20px; }
        .price { color: #00ffcc; font-size: 20px; font-weight: bold; display: block; margin: 10px 0; }
        .buy-btn { display: block; background: #00ffcc; color: #000; text-align: center; padding: 12px; text-decoration: none; font-weight: bold; border-radius: 4px; }

        footer { padding: 40px; color: #222; font-size: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="banner">
        <img src="https://via.placeholder.com/150?text=LOGO" alt="Logo" class="logo">
        <h1>THE DIY CORNER</h1>
        <p style="color: #00ffcc; letter-spacing: 2px;">INNOVATION & 3D PRECISION</p>
    </div>

    <nav>
        <a href="#home">Home</a>
        <a href="#store">Store</a>
        <a href="#social">Social</a>
    </nav>

    <section id="home">
        <h2 style="color: #00ffcc; margin-bottom: 20px;">LATEST PROJECTS</h2>
        <div style="width:100%; max-width:600px; aspect-ratio:16/9; background:#111; border:1px solid #222; display:flex; align-items:center; justify-content:center;">
            <p style="color:#444;">[ YOUTUBE VIDEO LOADS HERE ]</p>
        </div>
    </section>

    <section id="store">
        <h2 style="margin-bottom: 30px;">● Store & products :-</h2>
        <div class="grid">
            <div class="card">
                <img src="" alt="Product">
                <div class="card-body">
                    <h3>Naya Product Name</h3>
                    <span class="price">Rs. 000/-</span>
                    <a href="https://t.me/Thediycornerrofficial" class="buy-btn">BUY NOW</a>
                </div>
            </div>
            </div>
    </section>

    <section id="social">
        <h2 style="margin-bottom: 30px;">Connect</h2>
        <a href="Https://youtube.com/@thediycorner00?si=D2HQ5Vp180aZeF0x" style="display:block; width:100%; max-width:400px; padding:20px; border:1px solid #222; color:#fff; text-decoration:none; margin-bottom:10px; text-align:center;">YouTube</a>
        <a href="https://t.me/Thediycornerrofficial" style="display:block; width:100%; max-width:400px; padding:20px; border:1px solid #222; color:#fff; text-decoration:none; text-align:center;">Telegram</a>
    </section>

    <footer>&copy; 2026 THE DIY CORNER</footer>

</body>
</html>
