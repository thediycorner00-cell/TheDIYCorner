<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheDIYCorner | Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: sans-serif; }
        
        /* Banner & Nav */
        .banner { padding: 40px; text-align: center; border-bottom: 2px solid #00ffcc; background: #0a0a0a; }
        nav { display: flex; justify-content: center; gap: 20px; padding: 15px; background: #050505; sticky; top: 0; }
        nav a { color: #888; text-decoration: none; font-size: 12px; letter-spacing: 1px; }

        /* Product Grid */
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        
        /* Individual Product Card */
        .card { border: 1px solid #222; background: #0a0a0a; border-radius: 8px; overflow: hidden; transition: 0.3s; }
        .card:hover { border-color: #00ffcc; transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #1a1a1a; } /* Photo yahan aayegi */
        .card-info { padding: 15px; }
        .card-info h3 { font-size: 16px; margin-bottom: 10px; color: #eee; }
        .price { color: #00ffcc; font-weight: bold; font-size: 18px; }
        .buy-btn { display: block; background: #00ffcc; color: #000; text-align: center; padding: 10px; text-decoration: none; margin-top: 15px; font-weight: bold; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="banner">
        <h1>THE DIY CORNER</h1>
        <p style="color: #00ffcc; font-family: monospace;">OFFICIAL MINIATURE STORE</p>
    </div>

    <nav>
        <a href="#">HOME</a>
        <a href="#store">STORE</a>
        <a href="#about">ABOUT</a>
    </nav>

    <div class="container" id="store">
        <h2 style="border-left: 4px solid #00ffcc; padding-left: 10px;">LATEST MODELS</h2>
        
        <div class="grid">
            <div class="card">
                <img src="https://via.placeholder.com/300x200?text=BMW+M4+G82" alt="BMW M4">
                <div class="card-info">
                    <h3>BMW M4 G82 (1:12 Scale)</h3>
                    <p style="font-size: 12px; color: #777;">Handcrafted PVC, Moving Parts</p>
                    <p class="price">₹ Price On Request</p>
                    <a href="https://t.me/TheDiyCornerOfficial" class="buy-btn">BUY NOW</a>
                </div>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200?text=Rolls+Royce+Phantom" alt="RR">
                <div class="card-info">
                    <h3>Rolls-Royce Phantom</h3>
                    <p style="font-size: 12px; color: #777;">Luxury Series, Realistic Interior</p>
                    <p class="price">₹ Price On Request</p>
                    <a href="https://t.me/TheDiyCornerOfficial" class="buy-btn">BUY NOW</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
